      if (!raw) return ''
      const session = JSON.parse(raw)
      if (typeof session === 'string' && session) return session
    } catch (e) {}
    try { localStorage.removeItem('giscus-session') } catch (e) {}
    return ''
  }

  window.createShuoshuoGiscusWidget = (el, key, session) => {
    if (session === undefined) session = window.__giscusPendingSession || getStoredGiscusSession()
    const build = cfg => {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light'
      const isDark = currentTheme === 'dark'
      const __u = new URL(location.href)
      __u.searchParams.delete('giscus')
      const params = new URLSearchParams({
        repo: cfg.repo,
        repoId: cfg.repoId,
        category: '',
        categoryId: cfg.categoryId,
        mapping: 'specific',
        term: key,
        theme: isDark ? cfg.darkTheme : cfg.lightTheme,
        reactionsEnabled: '1',
        emitMetadata: '0',
        inputPosition: 'top',
        origin: __u.toString(),
        backLink: __u.toString(),
        session: session,
        strict: '0'
      })
      el.innerHTML = ''
      const widgetUrl = 'https://giscus.app/' + (cfg.lang || 'en') + '/widget?' + params.toString()
      const iframe = document.createElement('iframe')
      iframe.className = 'giscus-frame'
      iframe.title = 'Comments'
      iframe.setAttribute('data-theme', currentTheme)
      iframe.setAttribute('data-term', key)
      iframe.src = widgetUrl
      iframe.allow = 'clipboard-write'
      iframe.style.cssText = 'border:0;width:100%;min-height:180px;height:600px;background:transparent;color-scheme:' + (currentTheme === 'dark' ? 'dark' : 'light')
      el.appendChild(iframe)

      // 常驻、中性的"在新标签打开评论"入口:正常加载时是个不起眼的小链接;
      // 当 giscus 被广告拦截/浏览器跟踪防护/网络阻断而显示空白时,它是用户能看到评论的一键出口。
      const opener = document.createElement('a')
      opener.className = 'giscus-opener'
      opener.href = widgetUrl
      opener.target = '_blank'
      opener.rel = 'noopener'
      opener.textContent = '在新标签页打开评论 ↗'
      opener.title = '若评论区空白:多半是广告拦截(uBlock/AdGuard)、浏览器跟踪防护(Edge「跟踪防护」)屏蔽了 giscus.app,或当前网络无法访问;点此可在新标签查看评论,或对本站关闭拦截/跟踪防护后刷新。'
      opener.style.cssText = 'display:inline-block;margin-top:6px;font-size:12px;color:#858585;text-decoration:none;border-bottom:1px dashed #bbb'
      el.appendChild(opener)
    }
    const cfg = window.shuoshuoGiscusConfig
    if (cfg) { build(cfg); return }
    // pjax 时序:config 可能尚未暴露(后执行的 comments partial),轮询等待(最多 3s)
    let n = 0
    const wait = () => {
      const c = window.shuoshuoGiscusConfig
      if (c) build(c)
      else if (++n < 30) setTimeout(wait, 100)
    }
    wait()
  }

  // 监听 Giscus iframe 高度消息,按 event.source 精确匹配到对应 iframe 再各自适应高度
  // (同页有多条独立评论区,不能用同一条消息的高度套到所有 iframe,否则较高的会被压扁、配合 scrolling 截断后只剩一个空框)
  window.addEventListener('message', e => {
    if (e.origin !== 'https://giscus.app') return
    const d = e.data
    if (!d || typeof d !== 'object' || !d.giscus) return
    const h = d.giscus.resizeHeight || d.giscus.height || d.setHeight
    if (!h) return
    // 按 event.source 精确匹配到发送此消息的那一个 iframe(giscus 同页只会从首条 iframe 回传消息)
    const target = Array.from(document.querySelectorAll('iframe[src*="giscus.app/"]')).find(f => f.contentWindow === e.source)
    if (target) target.style.height = h + 'px'
  })

  window.addCommentToShuoshuo = e => {
    const btn = e.target.closest('.shuoshuo-comment-btn')
    if (!btn) return

    const ele = btn.closest('.container').nextElementSibling
    const isInclude = ele.classList.contains('no-comment')
    runDestroy()
    if (isInclude) {
      ele.classList.remove('no-comment')
      const key = `${location.pathname.replace(/\/$/, '')}?key=${ele.getAttribute('data-key')}`
      window.createShuoshuoGiscusWidget(ele, key)
    }
  }

  // 暗色模式切换时,更新所有 giscus iframe 主题(跟随博客 light/dark)
  btf.addGlobalFn('themeChange', () => {
    const tc = window.shuoshuoGiscusConfig
    if (!tc) return
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light'
    const isDark = currentTheme === 'dark'
    const theme = isDark ? tc.darkTheme : tc.lightTheme
    document.querySelectorAll('iframe.giscus-frame').forEach(f => {
      f.setAttribute('data-theme', currentTheme)
      f.style.colorScheme = isDark ? 'dark' : 'light'
      try { f.contentWindow.postMessage({ giscus: { setConfig: { theme: theme } } }, 'https://giscus.app') } catch (e) {}
    })
  }, 'shuoshuo-giscus-theme')

  // 处理 Giscus 登录回调(?giscus=session):存到 localStorage 与标准 giscus 行为一致,
  // 同时保留 window.__giscusPendingSession 供本页尚未创建的 iframe 立即使用。
  const __giscusCallback = new URL(location.href).searchParams.get('giscus')
  if (__giscusCallback) {
    try { localStorage.setItem('giscus-session', JSON.stringify(__giscusCallback)) } catch (e) {}
    window.__giscusPendingSession = __giscusCallback
    const __u = new URL(location.href)
    __u.searchParams.delete('giscus')
    history.replaceState(null, document.title, __u.toString())
  }

  // 监听 Giscus 回传的 session 错误,自动清除失效的 localStorage session。
  window.addEventListener('message', e => {
    if (e.origin !== 'https://giscus.app') return
    const d = e.data
    if (!d || typeof d !== 'object' || !d.giscus || !d.giscus.error) return
    const err = d.giscus.error
    if (err.includes('Bad credentials') || err.includes('Invalid state value') || err.includes('State has expired') || err.includes('Bad request')) {
      try { localStorage.removeItem('giscus-session') } catch (e) {}
    }
  })

})()

</script><script type="application/json" id="shuoshuo-data">[{"author":"SpeechlessPanda","date":"2026-07-12 23:30:00","content":"<p>今天和一个很久没联系的朋友深聊了一下。她有一些很有启发的观点，在此记录一下：“无论什么时候你都有改变自己想法的权利，只要能鼓励你继续前进，我觉得就是对的。”“改变是随时的，向前是一直的。”我的朋友们总是能给我一些观点来促进我的思考，感谢他们。</p>\n<p>还有一件事很感慨，我和我的朋友们属于是平常不怎么联系的类型。今天翻了下聊天记录，发现很多以前说好的事都没做到，比如见一面什么的，成年人的有心无力和迫不得已越来越多，但我不希望友谊因此淡下去，更希望这让我们更珍惜这份友谊以及偶尔来之不易的如约的约定。</p>\n<p>btw ，比赛的队里出了点小问题，头疼。今天我妈过来，陪了她一天，虽然也因此难得好吃好喝了一天。</p>\n","tags":["假期","感慨"],"commentCount":0},{"author":"SpeechlessPanda","date":"2026-07-11 23:30:00","content":"<p>全局变量的最佳命名前缀是什么？答案：//。 cpp 教程说，这个笑话值得所有评论。所以，交出你们的评论。</p>\n","tags":["假期","有趣","技术"],"commentCount":0},{"author":"SpeechlessPanda","date":"2026-07-10 23:30:00","content":"<p>今天看书看到上世纪八九十年代的一个 Wirth 定律：软件变慢的速度比硬件变快的速度更快。这句话挺有启发性的，但除了这点以外，让我非常想在这里分享这句话的另一个原因是，它另一个版本的表述： Intel 给予的， Microsoft 拿走。太有趣了。</p>\n<p>今天也是终于彻底进入干活的状态了，回到期末考前的作息。可喜可贺。下周小学期更是另一种意义上回到期末考前的状态。希望 CPU 不要太难搓，希望 jzm 是善良人格。</p>\n","tags":["假期","有趣","技术"],"commentCount":0},{"author":"SpeechlessPanda","date":"2026-07-06 23:30:00","content":"<p>颓废的三天，完全不像我预想的一样进入了比赛的状态。与其说在断断续续的推进比赛，不如说在各种其他活动中抽空做了一下比赛的内容。所以，我要立个 flag ，明天开始认真干活。主线比赛，支线学语言和看书。</p>\n<p>今天小学期课程安排出来了，怎么能既是 jzm ，又要上早八的。我都上了三次 jzm 了。人怎么能同时占这么多好事。</p>\n","tags":["假期"],"commentCount":1},{"author":"SpeechlessPanda","date":"2026-07-04 17:30:00","content":"<p>哈哈哈哈哈哈哈， this semester is over ！终于考完试了，感觉还行（要是砸了就是我感觉错了）。然后博客迎来了最新一次的更新，这次会像 pyq 一样，有评论的碎碎念就会显示评论出来，没有的则隐藏评论区。这个功能好像 giscus 原生是不支持的，实现用了一点小小的逆向，所以有想要做这个效果的朋友可以让 ai 读读我的仓库原码。这个小功能干了我一天，最后发现不行和浏览器缓存刷新机制有关，神秘了。</p>\n<p>今天较为颓废，明天开始要好好做和比赛有关的事了，或者有空学学 cpp 。今天甚至没锻炼，哎。</p>\n","tags":["博客更新","假期"],"commentCount":0},{"author":"SpeechlessPanda","date":"2026-07-02 23:30:00","content":"<p>今天晚上点了个外卖，送到另一个地方去了，要去拿很远，我有点烦，人的劣根性发力，想要退款且拿货（我忏悔）。但是当时申请退款的时候没想到商家会拿回去，结果就是商家没同意，然后申请店铺客服介入，骑手就把餐拿回去了。但是那个时候店铺客服还没同意退款，等于我饭财两空，我就有点难绷。一气之下开始平台客服申请退款。一开始默认弹出来的订单，是我的午饭，我没有察觉到，然后就申请了这个的，把经过跟客服说了，客服找不到骑手核实，就给我退款了。结果退款金额比晚饭钱少我倒是发现了，这才意识到不对。然后想想不能亏，人的劣根性又发力（我忏悔一点吧），又去平台申请了晚饭的退款，结果又通过了……还有前情提要是，中午由于骑手送达超时，我还获赔了 3 元，退款的时候这 3 元并没有算进去。所以我今天，在赚了 3 元的情况下，白吃了一顿午饭，唯一的代价是晚饭只能吃零食（还有就是我内心的忏悔了）。也不知道我这是幸运还是不幸。</p>\n","tags":["生活小事"],"commentCount":1},{"author":"SpeechlessPanda","date":"2026-06-30 23:30:00","content":"<p>tzb 大学果然名不虚传，今天看报名人数居然 500 多个，而且居然能重复报名，有大约 40 个人报了两项及以上，我认识的一个佬各种挂名报了 5 个……我自己的项目创业未办而中道崩殂，还没考完试，只是在跑 baseline 就已经有一大堆问题了，不敢想后面该怎么办。头大，宁愿期末周更久一点，也不想面对那些神奇的问题。果然痛苦是比较出来的，在比赛面前期末周都显得和蔼可亲。</p>\n","tags":["比赛","期末周"],"commentCount":0},{"author":"SpeechlessPanda","date":"2026-06-26 23:30:00","content":"<p>服了，比赛报名临时说不行，有个地方有问题，要重新盖章这些的。虽然我支持周末放假，但是这个节骨眼周末找不到行政盖章也挺无力的。还有就是，明明一个月的报名窗口期，偏偏要等到后半个月甚至最后十天才把盖章流程说出来，刨开节假日后真是酣畅淋漓的与时间赛跑。也是体会到学校行政的恶心之处了，之前体感还没这么明显。</p>\n<p>昨天看上一届学长在群里求实习，看的我不自觉瑟瑟发抖，我要是保不上研，后面本科就业会不会也是这样呢。哎，焦虑。</p>\n<p>今天考完计组了，但晚上回来一点复习状态没有，后面是最重要的两个考试课。我还觉得自己没有找到考试的状态，不知道怎么才能好一点。没招。</p>\n","tags":["焦虑迷茫","期末周"],"commentCount":2},{"author":"SpeechlessPanda","date":"2026-06-25 11:00:00","content":"<p>改了三四个小时，博客新功能终于稳定下来了。虽然大部分时候都是 agent 在干，但也是在期末周抽出了一部分精力和时间。要是对复习有这个热情或许学分绩就能高高的了吧（悲）。对了，碎碎念下面是可以评论的，欢迎大家来互动。</p>\n","tags":["博客更新","期末周"],"commentCount":0},{"author":"SpeechlessPanda","date":"2026-06-24 23:00:00","content":"<p>碎碎念上线啦!这里记录随手想法、短动态，和长文章分开。支持 <strong>markdown</strong>、<a href=\"https://speechlesspanda.github.io\">链接</a> 和标签。今天还给博客加了 OG 图自动生成，中文用 LXGW WenKai 渲染，分享链接有预览图了。现在博客的功能越来越多了，非常满意（前段时间悄咪咪更新了一大波功能，不知道有没有老读者发现）。</p>\n<p>BTW ，今天终于提前完成了复习计划里 dsa 的部分，不像之前一样要奋战到十点前最后一刻了，所以顺利地看了会计组，然后头就开始晕了，难顶。怎样才能像一些大佬一样，同时能把三个大比赛、期末周和提前毕设都做好呢（认真）。</p>\n","tags":["博客更新","期末周"],"commentCount":0}]</script><script>(() => {
  const limitConfig = {}

  const sortDataByDate = data => data.sort((a, b) => new Date(b.date) - new Date(a.date))

  const filterDataByLimit = (data, limit) => {
    if (!limit || !limit.type) return data
    if (limit.type === 'num') return data.slice(0, limit.value)
    if (limit.type === 'date') {
      const limitDate = new Date(limit.value)
      return data.filter(item => new Date(item.date) >= limitDate)
    }
    return data
  };

  const formatToTimeZone = (date) => {
    const fullDate = date.length === 10 ? `${date} 00:00:00` : date
    const visitorTimeZone = '' || Intl.DateTimeFormat().resolvedOptions().timeZone
    const options = {
      timeZone: visitorTimeZone,
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    }
    const [day, month, year, hour, minute, second] = new Intl.DateTimeFormat('en-GB', options)
      .format(new Date(fullDate))
      .match(/\d+/g)
    return `${year}-${month}-${day} ${hour}:${minute}:${second}`
  }

  const addLazyload = str => {
    const config = {
      enable: true,
      native: false,
      field: 'site',
      placeholder: '/null',
    }

    if (!config.enable || config.field !== 'site') return str
    const parser = new DOMParser()
    const doc = parser.parseFromString(str, 'text/html')
    const images = doc.querySelectorAll('img')

    images.forEach(img => {
      if (config.native) {
        img.setAttribute('loading', 'lazy')
      } else {
        const src = img.getAttribute('src')
        img.setAttribute('data-lazy-src', src)

        if (config.placeholder) {
          img.setAttribute('src', config.placeholder)
        } else {
          img.removeAttribute('src')
        }
      }
    })
    return doc.body.innerHTML
  }

  let currentPage = 1
  const itemsPerPage = 8
  let totalPages = 0
  let data = []
  let inputEventsAttached = false // Flag to mark if input event listeners have been added

  const renderData = (dataSlice) => {
    const content = dataSlice.map(item => {
      const formattedDate = formatToTimeZone(item.date)
      const tags = item.tags && item.tags.map(tag => `<span class="shuoshuo-tag">${tag}</span>`).join('') || ''
      const itemKey = item.key || ('memo-' + String(item.date || index).replace(/[^0-9a-zA-Z]/g, '-'))
      const commentButton = true
        ? `<div class="shuoshuo-comment-btn" onclick="addCommentToShuoshuo(event)">
            <i class="fa-solid fa-comments"></i>
          </div>`
        : ''
      const commentContainer = `<div class="shuoshuo-comment no-comment" data-key="${itemKey}"></div>`

      return `
        <div class="shuoshuo-item">
          <div class="container">
            <div class="shuoshuo-item-header">
              <div class="shuoshuo-avatar">
                <img class="no-lightbox" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-lazy-src="${item.avatar || '/img/avatar.png'}">
              </div>
              <div class="shuoshuo-info">
                <div class="shuoshuo-author">${item.author || 'SpeechlessPanda'}</div>
                <time class="shuoshuo-date" title="${formattedDate}">
                  ${btf.diffDate(formattedDate, true)}
                </time>
              </div>
            </div>
            <div class="shuoshuo-content">${addLazyload(item.content)}</div>
            <div class="shuoshuo-footer ${tags ? 'flex-between' : 'flex-end'}">
              ${tags ? `<div class="shuoshuo-tags">${tags}</div>` : ''}
              ${commentButton}
            </div>
          </div>
          ${commentContainer}
        </div>`
    }).join('')

    const container = document.getElementById('article-container')
    container.innerHTML = content

    window.lazyLoadInstance && window.lazyLoadInstance.update()
    btf.loadLightbox(document.querySelectorAll('#article-container img:not(.no-lightbox)'))
  }

  const renderNavigation = () => {
    const container = document.getElementById('article-container')
    const existingNav = container.nextElementSibling
    if (existingNav && existingNav.classList.contains('shuoshuo-navigation')) {
      existingNav.remove()
    }

    const pageInfoTemplate = '第 ${current} 页 / 共 ${total} 页'
    const pageInfoText = pageInfoTemplate
      .replace(/\$\{current}/g, currentPage)
      .replace(/\$\{total}/g, totalPages)

    const navHtml = `
      <div class="shuoshuo-navigation">
        <button onclick="window.shuoshuoPrevPage()" ${currentPage === 1 ? 'disabled' : ''}><i class="fa-solid fa-chevron-left"></i></button>
        <span class="shuoshuo-page-info">${pageInfoText}</span>
        <input type="number" class="shuoshuo-page-input" min="1" max="${totalPages}" placeholder="${currentPage}" onkeydown="window.shuoshuoHandleKeyDown(event)">
        <button onclick="window.shuoshuoNextPage()" ${currentPage === totalPages ? 'disabled' : ''}><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    `
    container.insertAdjacentHTML('afterend', navHtml)

    // Add input validation event listeners (only once)
    if (!inputEventsAttached) {
      setTimeout(() => {
        const input = document.querySelector('.shuoshuo-page-input')
        if (input) {
          // Clear placeholder when clicking the input box
          input.addEventListener('focus', (event) => {
            event.target.placeholder = ''
          })

          // Restore placeholder if no content when losing focus
          input.addEventListener('blur', (event) => {
            if (!event.target.value.trim()) {
              event.target.placeholder = currentPage
            }
          })

          input.addEventListener('input', (event) => {
            const value = parseInt(event.target.value) || 0
            let wasInvalid = false

            if (value > totalPages) {
              event.target.value = totalPages
              wasInvalid = true
            } else if (value < 1 && event.target.value !== '') {
              event.target.value = 1
              wasInvalid = true
            }

            // If value is corrected, show red and shake effect
            if (wasInvalid) {
              event.target.classList.add('invalid')
              setTimeout(() => {
                event.target.classList.remove('invalid')
              }, 500)
            }
          })

          inputEventsAttached = true // Mark that event listeners have been added
        }
      }, 0)
    }
  }

  const renderPage = (page) => {
    const start = (page - 1) * itemsPerPage
    const end = start + itemsPerPage
    const pageData = data.slice(start, end)
    renderData(pageData)
    renderNavigation()
    autoExpandComments()
  }

  // 有评论的碎碎念自动展开评论区(build 时已查 commentCount 注入 shuoshuo-data)
  const autoExpandComments = () => {
    if (!window.createShuoshuoGiscusWidget) return
    const containers = document.querySelectorAll('#article-container .shuoshuo-comment.no-comment[data-key]')
    containers.forEach(el => {
      const key = el.getAttribute('data-key')
      const item = data.find(d => (d.key || ('memo-' + String(d.date || '').replace(/[^0-9a-zA-Z]/g, '-'))) === key)
      if (item && item.commentCount > 0) {
        el.classList.remove('no-comment')
        el.setAttribute('data-auto', '1')
        const term = `${location.pathname.replace(/\/$/, '')}?key=${key}`
        window.createShuoshuoGiscusWidget(el, term)
      }
    })
  }

  // 碎碎念页内容动态加载，初始高度可能不足导致主题 main.js 的滚动监听提前退出，
  // 因此单独监听滚动并为 header 添加/移除 nav-fixed / nav-visible，保证下滑后导航栏有背景。
  const initShuoshuoHeaderScroll = () => {
    if (window._shuoshuoScrollAttached) return
    window._shuoshuoScrollAttached = true

    let lastTop = 0
    const handler = btf.throttle(() => {
      const $header = document.getElementById('page-header')
      if (!$header) return
