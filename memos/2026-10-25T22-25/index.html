<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>碎碎念 · 2026-10-25 22:25</title><link rel="canonical" href="https://speechlesspanda.github.io/memos/"><style>body{max-width:40rem;margin:3rem auto;padding:0 1rem;line-height:1.7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#24292f}header{color:#6a737d;font-size:.9rem;margin-bottom:1rem}a{color:#1f6feb}img{max-width:100%}footer{margin-top:2rem;font-size:.9rem}</style></head><body><article><header>碎碎念 · <time>2026-10-25 22:25</time></header><div><p>外卖又有趣事。今天生日想着晚上吃好点，点了个 26 的牛腩饭（正常够我吃一天半），老实说，味道还是不错的，败兴的是吃出了头发，然后果断申请售后。这商家可能是也知道自己的外卖卖的贵，还送了个食安险，然后就是退了我 37 … 你没听错，退多了一顿饭钱，第一次对该买保险的时候要买保险有这么直观的感受。</p><p>还吃了别人送的冰淇淋蛋糕，非常新奇，也比我想象的大，里面全是冰淇淋，还好和舍友们关系还不错，分而食之了。毕竟就算我只吃了 1/4 ，后面吃牛腩饭的时候也不得不选择不吃饭，而把菜吃完，不然太撑了。</p></div><footer><a href="https://speechlesspanda.github.io/memos/">← 查看全部碎碎念</a></footer></article></body></html>
